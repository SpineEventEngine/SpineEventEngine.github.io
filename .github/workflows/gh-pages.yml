name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - staging
  # Rebuilds the site on demand, e.g. to publish a change to `SECURITY.md` in
  # `SpineEventEngine/.github`: the Security policy page fetches that file at build time.
  workflow_dispatch:

env:
  HUGO_VERSION: 0.169.0
  # Pinned to the release the Spine sites were checked with. Newer releases
  # add Sass deprecations, which nobody has checked against those sites yet.
  DART_SASS_VERSION: 1.99.0
  # SHA256 of `dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz`, from the GitHub release.
  # Update alongside DART_SASS_VERSION.
  DART_SASS_SHA256: "f0a32ab99bc0a1eb62ea7140a056a1bca82d534390b7c3dba4f2016eb0077753"

jobs:
  deploy:
    # A manual run deploys only when started on `master`; on other branches, the job is skipped.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_SITE_COMMONS_PAT }}
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # The Spine Hugo theme compiles its SCSS with Dart Sass, because Hugo
      # deprecated LibSass in v0.153.0 and will remove it. Hugo does not
      # bundle Dart Sass: it runs the `sass` binary it finds on `PATH`, and
      # a site on that theme fails to build without one. The release
      # tarball is standalone, so no Node or Dart setup is needed. The
      # checksum guards the download. Sites still on LibSass ignore the
      # binary.
      - name: Install Dart Sass
        run: |
          archive="dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          curl -fsSLO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/${archive}"
          echo "${DART_SASS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          rm "${archive}"
          echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"

      # Hugo finds Dart Sass on `PATH`. `hugo env` lists it when it does.
      # `GITHUB_PATH` only takes effect from the next step on, so this check
      # cannot live in the install step above. It fails here, rather than
      # mid-build, if the install did not put `sass` where Hugo looks.
      - name: Check Dart Sass
        run: hugo env | grep 'github.com/sass/dart-sass'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '26'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Hugo Modules
        uses: actions/cache@v4
        with:
          path: /tmp/hugo_cache
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Install Dependencies
        working-directory: site
        run: npm ci

      - name: Build Spine
        working-directory: site
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site/public
