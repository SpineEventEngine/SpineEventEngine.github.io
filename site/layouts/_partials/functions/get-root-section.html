<!--
Returns the root section of the page.

For example:
* `docs/1/guides/installation/zip/` -> `docs`.
* `release-notes/2025/2025/v3-3-3/` -> `release-notes`.
-->

{{ $currentPage := . }}
{{ $pagePathSegments := slice }}
{{ if .File }}
    {{ $pagePathSegments = split $currentPage.File.Path "/" }}
{{ end }}
{{ $currentRootSection := index $pagePathSegments 0 }}

{{ return $currentRootSection }}
