<div id="hero" class="nav-hero-container home-hero" role="banner">
    {{ with .Resources.GetMatch "hero.json" }}
        {{ $data := .Content | unmarshal }}
        {{ $title := split $data.title " " }}
        {{ $title = printf "%s <span>%s %s</span>" (index $title 0) (index $title 1) (index $title 2) | safeHTML }}
        <div class="hero">
            <div class="container">
                <h1 class="hero-title">{{ $title }}</h1>
                <div class="hero-lead">
                    <p>{{ $data.description | markdownify }}</p>
                </div>
            </div>
        </div>
    {{ end }}
</div>
