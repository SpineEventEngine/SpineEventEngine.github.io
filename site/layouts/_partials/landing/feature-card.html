{{ $icon := .icon }}
{{ $title := .title }}
{{ $description := .description }}

<div class="feature-card">
    <i class="card-icon-font {{ $icon }}"></i>
    <div class="card-content-text">
        <header class="feature-card-title">{{ $title | markdownify }}</header>
        <p>{{ $description | markdownify }}</p>
    </div>
</div>
