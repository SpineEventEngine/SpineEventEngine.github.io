<!--
Initializes Algolia DocSearch for the navigation bar.
-->

{{ $config := site.Params.libs.docsearch }}
{{ with $config }}
    <script src="https://cdn.jsdelivr.net/npm/@docsearch/js@alpha"></script>
    <script type="text/javascript">
        docsearch({
            container: '#docsearch',
            appId: '{{ .appId }}',
            indexName: '{{ .index }}',
            apiKey: '{{ .apiKey }}',
            theme: 'light',
        });
    </script>
{{ end }}
