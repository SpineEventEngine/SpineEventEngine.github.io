{{ with .Resources.GetMatch "support-section.json" }}
    {{ $data := .Content | unmarshal }}
    <section class="support-section">
        <div class="container-fluid content-holder">
            <div class="row">
                {{ range $data.items }}
                    <div class="col-lg-4">
                        <div class="support-container {{ .title | anchorize }}">
                            <h4>{{ .title | markdownify }}</h4>
                            {{ range .content }}
                                <p>{{ . | markdownify }}</p>
                            {{ end }}
                        </div>
                    </div>
                {{ end }}
            </div>
        </div>
    </section>
{{ end }}
