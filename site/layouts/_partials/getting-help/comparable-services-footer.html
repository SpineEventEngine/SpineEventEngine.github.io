<!--
The component renders two columns of actions.

The first column includes the price, agreement checkboxes, and an order button.
The second includes the mailto button.

Each column will be displayed inside its own comparable card.
-->

<div class="card-cell footer-cell">
    <div class="action-block">
        <div class="pricing-block">
            <span class="price">€ 5,690</span>
            <span class="slash">/</span>
            <span class="description">1 support pack (100&nbsp;hours)</span>
        </div>
        <div class="checkboxes-list">
            <label class="checkbox-container" for="privacyConsent">
                <span class="text">I agree to processing of my personal information as per the
                    <a href="{{ `privacy-statement/`| relURL }}"
                       class="external-link"
                       target="_blank">Privacy&nbsp;Statement</a>.</span>
                <input type="checkbox"
                       class="consent"
                       id="privacyConsent"
                       autocomplete='off'>
                <span class="checkmark"></span>
            </label>
            <label class="checkbox-container" for="supportAgreementConsent">
                <span class="text">I agree to the terms of the
                    <a href="{{ `development-support-agreement/` | relURL }}"
                       class="external-link"
                       target="_blank">Development Support Agreement</a>.</span>
                <input type="checkbox"
                       class="consent"
                       id="supportAgreementConsent"
                       autocomplete='off'>
                <span class="checkmark"></span>
            </label>
        </div>
        <!-- The tooltip visibility is managed in the `js/pages/pricing.js`. -->
        <div class="pricing-btn-holder"
             data-bs-toggle="tooltip"
             data-bs-placement="bottom"
             data-bs-title="Read and agree to the terms to&nbsp;continue.">
            <button class="btn btn-primary-blue pricing-btn order-btn disabled"
                    id="order-now-btn"
                    disabled>Order Now</button>
        </div>
    </div>
</div>
<div class="card-cell footer-cell">
    <div class="action-block">
        {{ partial "getting-help/mailto-button.html" . }}
    </div>
</div>
