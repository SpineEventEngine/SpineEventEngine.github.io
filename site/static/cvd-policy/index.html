<!DOCTYPE html>
<!--
  The Coordinated Vulnerability Disclosure Policy moved to `/docs/security/cvd-policy/`.

  Keep this redirect indefinitely: the organization-wide `SECURITY.md` links to `/cvd-policy/`,
  and so do sites we don't control. GitHub Pages cannot send HTTP redirects, so this page
  redirects in the browser, as the pages Hugo generates for `aliases` do.

  The URLs are site-relative, so the redirect also works on a local preview, and the link
  check follows it to the local copy of the page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Coordinated Vulnerability Disclosure Policy</title>
    <link rel="canonical" href="/docs/security/cvd-policy/">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=/docs/security/cvd-policy/">
  </head>
  <body>
    <p>
      This page has moved. If you are not redirected, open the
      <a href="/docs/security/cvd-policy/">Coordinated Vulnerability Disclosure Policy</a>.
    </p>
  </body>
</html>
